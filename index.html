  <section class="chapter" id="clc-student-resources" style="--c:#FF8A1F;--i:0">
    <h2 class="tab">CLC Student Resources</h2>
    <div class="sheet">
      <p class="byline">Noah Zielinski · CLC 120 302 · 8/26/2026</p>
      <div id="resources" style="display:grid;gap:1.25rem"></div>
      <div style="display:grid;gap:1.25rem">
        <article class="res"><h3>Prompt 1: The Syllabus as Your Academic Contract</h3><p>The syllabus matters most in my online classes, where nobody stands at the front of a room reminding me what is due. A syllabus works as a contract: it states what the professor will teach and grade, and what I agree to do in return, including deadlines, grading weights, and policies on late work. At the start of the semester I treated it as a one-time read. I learned that much of the “hidden curriculum” in an asynchronous course is unwritten. Nobody tells you to check the due dates every week or to start the material before it is due. As the semester went on, I began going back to each syllabus at the start of the week and copying its deadlines into my weekly schedule. That turned the syllabus from a document I skimmed once into a roadmap I used constantly, and it helped me meet expectations instead of finding them out after the fact.</p></article>
        <article class="res"><h3>Prompt 2: Self-Advocacy and the Shift to “Help-Seeking Behaviors”</h3><p>I usually realize I am struggling over a small problem I can’t solve on my own, like being locked out of the student portal or being unsure about a date or deadline. In high school, someone else might have noticed. In college, I have to notice it myself and ask. When I couldn’t access the portal, I called the Welcome and One Stop Center, and they helped me get back in and answered my questions about dates and deadlines in a few minutes. That kept me from guessing and from falling behind on work I couldn’t see. I also plan to use my Academic Success Advisor and the Financial Aid Office for my transfer planning and paperwork. At the start of the semester I hesitated to ask, because I didn’t want to bother anyone or look like I didn’t know what I was doing. By now I am much more comfortable. I know these offices exist to be asked, so I ask early, before a small problem turns into a big one.</p></article>
        <article class="res"><h3>Prompt 3: Navigating Academic Policies and High-Stakes Decisions</h3><p>One policy that affects me is my instructors’ late work policies, which penalize work that comes in after the deadline. My schedule is tight, with a full online course load and work shifts, so when midterm deadlines land in the same week as extra work hours, I can’t do everything at once. The Eisenhower Decision Matrix sorts tasks by urgency and importance. For me, assignments due soon that carry a late penalty are urgent and important, so they go first. Studying for a later exam is important but not yet urgent, so I schedule it into set blocks. Small urgent tasks that don’t affect my grade get handled quickly, and tasks that are neither urgent nor important get cut. Because I knew late work costs points, I decided to take time out of my socialization blocks instead of turning something in late. Protecting my final grade matters more than that free time, and reading the policy first meant I made that choice on purpose instead of in a panic.</p></article>
      </div>

  <section class="chapter" id="study-plan" style="--c:#FFC93C;--i:1">
    <h2 class="tab">Study Plan</h2>
    <div class="sheet">
      <div class="stats">
        <div><b>20</b>hours in class each week</div>
        <div><b>9</b>hours of homework &amp; studying each week</div>
      </div>
      <p class="note">All my courses are online and asynchronous except one, so most of my time “in class” is actually just doing the homework.</p>
      <h3 class="sub">My Weekly Schedule</h3>
      <div class="sched" tabindex="0" role="region" aria-label="Weekly schedule, scrolls sideways on small screens"><div class="grid" id="grid"></div></div>
      <h3 class="sub">If Things Change</h3>
      <dl class="plans">
        <dt>Unexpected sickness</dt><dd>N/A. I don’t take care of anyone.</dd>
        <dt>Scheduled to work more hours than usual</dt><dd>I take time out of my socialization blocks to do homework or to cover the extra hours.</dd>
        <dt>Losing regular transportation</dt><dd>N/A. All of my classes are online.</dd>
        <dt>Big project</dt><dd>I take time out of my socialization blocks.</dd>
      </dl>
            <article class="res"><h3>Prompt 1: Navigating the Transition — From Passive to Active Learning</h3><span class="badge">Reflection</span><p>In high school, other people managed most of my time. At CLC, almost all of my classes are online and asynchronous, so I have to decide when to work, what to read, and when I am falling behind. The biggest part of the “hidden curriculum” for me is that no one reminds you of anything, and most learning happens outside of class. I adjusted by building a weekly schedule, checking the syllabus every week, and treating homework time as class time. The writing has also changed, from short assignments to longer work that needs planning and revision. I have not used office hours much yet, and I want to start, because an instructor is a resource I am not taking advantage of.</p></article>
      <article class="res"><h3>Prompt 2: Defining Your “WHY” — The Foundation of Grit</h3><span class="badge">Reflection</span><p><b>Why am I in college?</b> To earn a degree. <b>Why?</b> The career I want, cybersecurity, usually requires at least a bachelor’s degree. <b>Why cybersecurity?</b> I enjoy solving problems and building things with code, and I like work that is investigative and creative. <b>Why does that matter?</b> I want work that keeps me interested and lets me lead projects, not just earn a paycheck. <b>Why?</b> To me, a good life means setting goals and accomplishing them, and my career is the biggest goal I have. My core motivation is living a satisfying, goal-driven life. During a busy work week or before a hard exam, I remind myself that each assignment is a small step toward that, and it keeps me going when I would rather quit.</p></article>
      <article class="res"><h3>Prompt 3: Mastering Time and the “Domino Effect”</h3><span class="badge">Reflection</span><p>I have felt a small domino effect. When a work shift ran long, I lost study time, and then an assignment slipped closer to its deadline. I resolved it by moving homework into my socialization blocks, as my study plan says, and catching up before the next deadline. The strategies that work best for me are “eating the frog,” doing the hardest assignment first, and writing a Daily Top Three so I know what must get done. My schedule is close to the 8-8-8 rule, with about nine hours of sleep, and I plan nine hours a week of outside study. These choices were mostly effective, but I could still protect more study time during heavy work weeks.</p></article>

  <section class="chapter" id="study-strategies" style="--c:#7BD389;--i:2">
    <h2 class="tab">Study Strategies</h2>
    <div class="sheet">
      <p class="byline">Noah Zielinski · Amanda Cash · CLC 120 302 · 09/09/26 · Module 3 Core Assignment</p>
      <div style="display:grid;gap:1.25rem">
        <article class="res"><h3>Reading Strategy</h3><p>I personally would use Skimming as my main reading strategy. This is because I don’t have a lot of time in my schedule, and this allows me to save on time while still understanding the structure of the information. I actually already use this strategy, and not only in class. For example, when I am rereading a book because I have some extra time, I usually skim.</p></article>
        <article class="res"><h3>Note-Taking Shorthand</h3><p>I do like decipherable shorthand. Firstly, because it just seems cool to me, to have this mini little “code language” only I understand, and secondly, because it saves time and energy. Writing &amp; instead of and, 2 instead of to, 4 instead of for, etc etc. Less hand fatigue, less time spent.</p></article>
        <article class="res"><h3>What I Learned About Memory</h3><p>I learned that working memory is actually very small. I would have thought it could hold a couple dozen items, but I learned it can hold usually between 5 and 9 items. I also learned that it is very short, a few seconds or up to a minute. I thought it would last up to an hour. I think I was overestimating how much working memory can do. I also learned that long-term memory is basically infinite storage capacity. I was always under the impression that humans lose memory because we start running out of “space” to store memories, but it seems that’s not true.</p></article>
        <article class="res"><h3>My Study Methods</h3><p>I like to use practice testing and concept association in my study sessions. I usually study by making a study guide, uploading it to a tool like quizlet, and running through it a bunch. When I get a question wrong, I look through the actual answer and associate it with something around me, or maybe a similar word or phrase or experience.</p></article>
        <article class="res"><h3>My Test-Taking Plan</h3><p>I will approach test-taking the way this module outlines. I will get to the location a few minutes early, and take a few calming breaths while getting my supplies ready. I will answer all the required questions first, giving the most attention to the ones I understand the least. I will go over the test once or twice at the end, to make sure I didn’t make any accidental mistakes, provided I have the time. And I will study the results of my test, what I got right and wrong.</p></article>
      </div>
            <article class="res"><h3>Prompt 1: Transitioning to Active Academic Engagement</h3><span class="badge">Reflection</span><p>My main reading strategy is skimming, which gets me the structure but does not replace active reading. I have not used SQ3R consistently, and I think that shows when I need to recall details. For notes I use shorthand, like & for and and 2 for to, and I turn my notes into a study guide. After class I add associations to my notes by linking an idea to something familiar, which helps fight the Ebbinghaus Forgetting Curve. Next semester I will try SQ3R for heavy reading and the Cornell Method, so my notes include review questions and summaries and work as real study guides.</p></article>
      <article class="res"><h3>Prompt 2: The Science of “Learning to Learn”</h3><span class="badge">Reflection</span><p>My routine centers on practice testing. I make a study guide, put it into Quizlet, and run through it repeatedly, spread over several days instead of one night. I use interleaving less, and I want to mix topics more. I keep distractions like my phone away while I study, and my schedule protects about nine hours of sleep, because tired studying does not stick. The myth I need to abandon is that skimming or rereading is enough to learn something. To sharpen the saw, I will add a recite step, explaining each idea out loud in my own words.</p></article>
      <article class="res"><h3>Prompt 3: Mastering the Testing Lifecycle</h3><span class="badge">Reflection</span><p>My test-day plan is to arrive a few minutes early, take calming breaths while I set up, answer all the required questions, and give the most attention to the ones I understand least. I save time at the end to check for accidental mistakes. Afterward I study my results to see whether I missed something because I did not know the content or because of a test-taking habit. I do not deal with much test anxiety, but controlled breathing is my tool if I do. For finals, I will move past surface memorization by using practice tests and timed writing, and by explaining concepts instead of just recognizing them.</p></article>

        <p>From the trait descriptions: “Thinkers who love working on interesting problems. They are ambitious and like to start and lead projects.”</p>

        </div>
        <h4 class="mini">My synthesis</h4>
        <dl class="qa"><dt>Do the top skills employers ask for match what you can or would like to do?</dt><dd>Not really</dd><dt>Who are the top three employers hiring over the past six months?</dt><dd>University of Chicago, Northwestern University, and University of Illinois Chicago</dd><dt>What does the employment projection graph show?</dt><dd>This job outlook is growing</dd><dt>What is the best thing you learned about the career?</dt><dd>The best thing I learned is that this career actually requires skills in marketing more than it does in student services, which I didn’t expect.</dd><dt>What is the worst part about the career?</dt><dd>The worst part for me is the job description itself. The day-to-day work doesn’t really appeal to me.</dd><dt>What concerns would you have about this career?</dt><dd>My main concern is working with teenagers, because I find them hard to work with.</dd><dt>Is it a career you would consider pursuing?</dt><dd>Not really</dd><dt>What else would you want or need to know before making a decision?</dt><dd>I don’t need to know anything else right now. I don’t see myself pursuing this career, so I have no further questions.</dd></dl>
      </article>
      <article class="res">
        <h3>Understanding the Role of Your Academic Success Advisor (ASA)</h3>
        <span class="badge">Reflection</span>
        <p>An ASA, or Academic Success Advisor, is someone who guides students through college and helps them make the best choices to reach their goals. Every student at CLC is assigned an ASA based on their major, so the advisor can give guidance specific to that field. Students should meet with their ASA at least three times per semester: once at the beginning, once in the middle, and once at the end. To get the most out of each meeting, I should plan my questions ahead of time and take notes during the meeting. One of my biggest upcoming challenges is planning how to transfer to my desired four-year university, so that is a good topic to bring to my ASA. I would ask what I should get done now to prepare for the transfer.</p>
        <dl class="qa"><dt>My ASA</dt><dd>Emily Ciecil</dd><dt>ASA’s email</dt><dd>eciesil@navigate.clcillinois.edu</dd></dl>
      </article>
            <article class="res"><h3>Prompt 1: Defining Your “Career” and Finding the “Fit”</h3><span class="badge">Reflection</span><p>My ideal career is in cybersecurity. It feels like a calling and not just a job because it combines what I already do for fun, like programming projects and building websites, with investigative problem-solving. My top values are problem-solving, creativity, and stability, and my career assessment showed Investigative, Artistic, and Enterprising as my top traits. Cybersecurity usually requires at least a bachelor’s degree, so my path at CLC gives me the foundation of Knowledge, Skills, and Abilities in computing, networking, and critical thinking that employers look for.</p></article>
      <article class="res"><h3>Prompt 2: Academic Goals as “Stepping Stones”</h3><span class="badge">Reflection</span><p>My primary long-term academic goal is to transfer to a four-year university for a bachelor’s degree in cybersecurity. My three short-term SMART goals are: (1) pass all of my fall courses by the end of the semester in December 2026; (2) meet with my Academic Success Advisor by the end of the fall semester to map the transfer requirements for a four-year program; and (3) complete my first two semesters of required major courses while keeping a GPA of at least 3.5 through spring 2027. These milestones prepare me for the real world by building my technical foundation, keeping my transfer on track, and teaching the planning and follow-through employers expect.</p></article>
      <article class="res"><h3>Prompt 3: The Career Planning Cycle and “Trying Things Out”</h3><span class="badge">Reflection</span><p>I plan to join a CLC student club related to computing or technology, look into internships and student worker jobs through the Career and Job Placement Center, and keep building experience at the startup where I already work. These experiences build transferable skills like communication, teamwork, and problem-solving that are valuable in any industry. I will also use them to test my fit. If the work energizes me and I want to do more of it, that is evidence cybersecurity is right for me. If it does not, I can adjust my plan early.</p></article>
      <a class="back" href="#contents">Back to contents</a>
    </div>
  </section>

  <section class="chapter" id="growth-mindset" style="--c:#4C8DFF;--i:4">
    <h2 class="tab">Growth Mindset, Thinking, &amp; Self Advocacy</h2>
    <div class="sheet essay">
      <p class="byline">Noah Zielinski · CLC 120 · Reflection</p>
      <p>One challenge I have faced this semester is managing a heavy course load on top of a work schedule. Almost all of my classes are online and asynchronous, so nobody tells me when to show up, and most of my “class time” is really just homework. At first I treated the situation as a test of whether I was naturally good at managing my time. Looking back, my response was a mix of both mindsets. According to Open Stax College Success, a growth mindset is the belief that abilities can be developed through effort, good strategies, and learning from feedback, while a fixed mindset treats ability as something a person either has or does not have (Baldwin). I showed a growth mindset when I built a weekly schedule, started using strategies like skimming and practice testing, and kept adjusting what did not work. A fixed mindset would have been giving up on the schedule the first time I fell behind. Two parts of a growth mindset could have helped me even more: treating mistakes as useful feedback instead of failures, and asking for help earlier. My strengths that support my growth are planning ahead, a willingness to try new tools like Quizlet and shorthand, and a practical, problem-solving approach to my time.</p>
      <p>Being a self-advocate means speaking up for what I need to succeed and using the resources available to me, instead of waiting for someone to notice a problem. Baldwin’s textbook presents taking personal responsibility for your own success as a central part of college, and I think strong self-advocacy builds on that (Baldwin). The key components are knowing my own strengths and needs, knowing what resources exist, communicating clearly and respectfully, setting goals, and following through. In an academic setting, I can email an instructor early when an assignment is unclear, meet with my Academic Success Advisor to plan my transfer to a four-year university, and visit the Financial Aid Office to sort out my paperwork. In a professional setting, I can tell my supervisor about schedule conflicts ahead of time, ask for feedback on my work, and ask about training opportunities. Developing these skills will help me avoid problems that grow when they are ignored. It will also make my transfer smoother and help me get more out of the jobs I hold.</p>
      <p>While writing this reflection I used several kinds of thinking. I used metacognition, because I looked at how I handled my own challenge and judged which of my strategies worked. I used analytical thinking when I broke the challenge into parts, such as scheduling, study methods, and asking for help. I used critical thinking when I honestly admitted that my response was only partly a growth mindset, instead of claiming it was perfect. I used problem-solving when I thought about which strategies could help next time. I used information literacy when I connected my own experience to the course textbook and cited it. I know this because each step required me to examine, compare, and support my ideas instead of just describing what happened.</p>
      <h3 class="sub">Works Cited</h3>
      <p class="cited">Baldwin, Amy, et al. <i>College Success</i>. OpenStax, 2020, openstax.org/books/college-success.</p>
            <article class="res"><h3>Prompt 1: From “Learning Styles” to Strategic Adaptability</h3><span class="badge">Reflection</span><p>I do not rely on one learning style. I use visual tools like flashcards and diagrams, aural methods like listening to explanations while I work, and hands-on practice like quizzing myself. When a textbook concept was hard to follow, I paired it with a video or an example and then tested myself on it, which worked better than rereading. Understanding my own needs, as Uses and Gratification Theory describes, lets me choose the resources that fit my goal instead of waiting for an instructor to present information in a perfect way.</p></article>
      <article class="res"><h3>Prompt 2: Developing a Growth Mindset and “Grit”</h3><span class="badge">Reflection</span><p>A setback this semester was falling behind when my work and class deadlines overlapped. My first reaction was frustration, which was partly a fixed mindset, but I moved to a growth mindset by treating it as a problem to solve. I rebuilt my schedule, started copying syllabus deadlines into it, and practiced the study strategies that were not working until they improved. Next, I want a “grit partner,” such as a classmate, to keep me accountable. Shifting from performance goals to learning goals means I focus on understanding the material instead of just the grade, which makes me more willing to ask questions and try again.</p></article>
      <article class="res"><h3>Prompt 3: The Toolkit of Thinking</h3><span class="badge">Reflection</span><p><b>Metacognition.</b> I looked at my study habits using something like the Plan-Track-Assess cycle. I planned a study guide and Quizlet sessions, tracked which questions I kept missing, and assessed by studying the right answers and associating them with something familiar. That showed me my weak spots, and I shifted more of my time toward them.</p><p><b>Problem-Solving.</b> The root issue was not that I lacked time, but that my work shifts and my classes collided. I came up with three solutions: take time from my socialization blocks, move my study sessions to a different part of the day, or ask my employer to shift my hours. I chose the first for the short term, and I will try the others if the problem repeats.</p></article>
      <a class="back" href="#contents">Back to contents</a>
    </div>
  </section>

  <section class="chapter" id="identity-project" style="--c:#9B6BFF;--i:5">
    <h2 class="tab">Identity Project</h2>
    <div class="sheet essay">
      <p class="byline">Noah Zielinski · Michelle Pas · CLC 120 302 · 30 September 2026 · Module #6 Core Assignment</p>
      <h3 class="sub">My Identity Map</h3>
      <div class="map" role="group" aria-label="Map of my personal and social identities">
        <div class="core">Noah<small>identity map</small></div>
        <h4 class="mini gh" style="--g:#9B6BFF">Personal identities</h4>
        <ul class="idg" style="--g:#9B6BFF"><li class="chip"><span class="ic" aria-hidden="true">👤</span><span><small>Race</small><b>White</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🌍</span><span><small>Ethnicity</small><b>Romanian, American, Japanese</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🧍</span><span><small>Gender</small><b>Man</b></span></li><li class="chip"><span class="ic" aria-hidden="true">✨</span><span><small>Gender expression</small><b>Cisgender</b></span></li><li class="chip"><span class="ic" aria-hidden="true">❤️</span><span><small>Sexual orientation</small><b>Heterosexual</b></span></li><li class="chip"><span class="ic" aria-hidden="true">💪</span><span><small>(Dis)ability</small><b>Able-bodied</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🎂</span><span><small>Age</small><b>Young adult</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🇺🇸</span><span><small>Nationality</small><b>American</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🏠</span><span><small>Class</small><b>Middle class</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🔭</span><span><small>Religion / spirituality</small><b>Atheist</b></span></li></ul>
        <h4 class="mini gh" style="--g:#2EC4B6">Social identities</h4>
        <ul class="idg" style="--g:#2EC4B6"><li class="chip"><span class="ic" aria-hidden="true">🛂</span><span><small>Citizenship status</small><b>U.S. citizen, Romanian citizen</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🗣️</span><span><small>First language</small><b>English</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🌱</span><span><small>Political affiliation</small><b>None (Green, if I must pick)</b></span></li><li class="chip"><span class="ic" aria-hidden="true">👪</span><span><small>Family status</small><b>Partnered; nuclear family</b></span></li><li class="chip"><span class="ic" aria-hidden="true">➖</span><span><small>Caregiver status</small><b>N/A</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🏀</span><span><small>Size / appearance</small><b>Tall, athletic</b></span></li><li class="chip"><span class="ic" aria-hidden="true">🗺️</span><span><small>Geography</small><b>United States of America</b></span></li><li class="chip"><span class="ic" aria-hidden="true">➖</span><span><small>Military status</small><b>N/A</b></span></li><li class="chip"><span class="ic" aria-hidden="true">💼</span><span><small>Employment status</small><b>Employed</b></span></li></ul>
      </div>
      <h3 class="sub">Reflection</h3>
      <h4 class="mini">Of the different aspects of your identity, do you have more or fewer that provide you with a level of power or privilege? How does this impact how you experience school?</h4>
      <p>I have more identities that give me power or privilege than ones that don’t. Being male, middle class, American, and a college student all work in my favor. Being middle class means I can focus on school without having to worry constantly about money. Being American means I don’t have to deal with the language or citizenship barriers some students face. My Romanian and Japanese background is part of who I am, but it rarely comes up at school. I feel American, and I don’t often feel singled out or out of place because of my background. Being 18 means I’m the typical age for a college student, so I fit in with most of my peers. Overall, I just treat school as what it is: a kind of unpleasant but necessary growing experience that I can use as a stepping stone for my major goals in life.</p>
      <h4 class="mini">How does having a diverse student body improve your educational experience?</h4>
      <p>I don’t have one standout moment where a classmate completely changed my mind, but I think diversity helps even when it’s quiet. People who grew up in different places or with different experiences notice different things, and that gives me a wider view of any topic than I’d get on my own. Being around people who aren’t like me also keeps me from assuming my way of seeing things is the default. Since my background gives me a bit of a blend of cultures, I know firsthand that one perspective is never the whole picture, and a diverse student body is where that idea gets tested.</p>
      <h4 class="mini">What parts of your identity have the potential to help you be successful in college? Why do you think this?</h4>
      <p>Being middle class and being a college student help me succeed because they give me the stability and access to focus on my education. But the thing that matters most isn’t really on the identity lists: discipline. I set goals and I fight like a demon to follow through on them. I think that’s the biggest factor in my success, because opportunities and resources only matter if you actually use them, and discipline is what turns them into results.</p>
            <article class="res"><h3>Prompt 1: Analyzing the “Context” of a Communication Breakdown</h3><span class="badge">Reflection</span><p>My misunderstandings tend to come from text-only communication in online classes. When an assignment instruction seemed unclear, I assumed what the instructor meant instead of asking, and I did not notice until later. The method (online text, with no tone or face) and the timing (late at night, when I was rushed) shaped it, and stress was a barrier. Next time, I will ask a clear question early by email, write down exactly what I am unsure about first, and wait before replying if I am frustrated.</p></article>
      <article class="res"><h3>Prompt 2: Intersectionality and Cultural Competency</h3><span class="badge">Reflection</span><p>Two of my roles are student and employee. As a student I communicate mostly in writing and on my own, and as an employee at a startup I communicate more directly and quickly. My Romanian, American, and Japanese background taught me that one perspective is never the whole picture, which helps me empathize with classmates and instructors from different backgrounds. Practicing cultural competency means listening without assuming. For example, in a group project, assuming a teammate is careless when they simply have a different communication style would be a mistake, and listening first would help me bridge that gap.</p></article>
      <article class="res"><h3>Prompt 3: Emotional Intelligence and Active Listening</h3><span class="badge">Reflection</span><p>In an online group discussion or a debate, I sometimes start forming my rebuttal while the other person is still talking. Active listening means setting that aside, removing distractions, and trying to understand why their view made sense to them. Stress can blur the message for both people, so staying calm helps. Developing empathy will make me a better self-advocate, because I can explain my needs in a way the other person understands, and a better collaborator in group projects and disputes.</p></article>
      <a class="back" href="#contents">Back to contents</a>
    </div>
  </section>

  <section class="chapter" id="wellness-plan" style="--c:#FF6F9C;--i:6">
    <h2 class="tab">Wellness Plan</h2>
    <div class="sheet">
      <p class="byline">Noah Zielinski · CLC 120 · My Wellness Plan</p>
      <div style="display:grid;gap:1.25rem">
        <article class="res"><h3>What Leading a Healthy Lifestyle Means to Me</h3><p>To me, leading a healthy lifestyle is leading your life in a way that not only extends it as long as possible, but also leaves you feeling satisfied and content as much as possible. That means the most important part of leading a healthy life is setting goals for yourself and accomplishing them. Additionally, it means not destroying your body with bad habits.</p></article>
        <article class="res"><h3>What I’ll Do to Take Care of My Physical Health</h3><p>I like to swim and go on runs for intense cardio. I also regularly go on long walks. On top of that, I like to think I eat well-balanced meals consistently. I make sure I have an adequate amount of protein, carbs, and veggies with every meal, or if I miss out during one meal, I make up for it with the next meal.</p></article>
        <article class="res"><h3>What I’ll Do to Take Care of My Emotional Health</h3><p>I like to listen to music and read books. I’m almost always listening to music: while doing homework, while driving, even while just chilling. I also read a lot. My favorite saying is “a book a day makes the happiness stay.”</p></article>
        <article class="res"><h3>What I’ll Do to Take Care of My Mental Health</h3><p>I work on a lot of personal projects. Most of them are programming projects, such as making video games, websites, or even just random projects like building an image editor. I am also working on and off on creative writing projects.</p></article>
        <article class="res"><h3>What I’ll Do to Maintain Healthy Relationships</h3><p>I like to maintain my relationships by checking in and talking constantly. Case in point, my girlfriend and I. She is currently far away at university, but we video call every day. I also regularly start conversations in group chats and schedule meetups.</p></article>
        <article class="res"><h3>What I’ll Do to Stay Safe</h3><p>I believe staying safe means maintaining a healthy lifestyle. I do this by not only leading the healthy lifestyle I outlined above, but also by staying out of dangerous situations. Drugs and alcohol are a no-go for me.</p></article>
        <article class="res"><h3>What I’ll Do to Take Care of My Financial Health</h3><p>I am currently in school to get my degree. My chosen career path, cybersecurity, usually requires at least a bachelor’s degree. I am also currently employed and part of a startup.</p></article>
        <article class="res"><h3>How My Wellness Plan Will Contribute to My Success</h3><p>Every portion of my wellness plan is designed to help me lead a healthy lifestyle, and that is what I would consider success. Leading a healthy lifestyle is the most important thing, beyond anything wealth can buy or power can grab.</p></article>
      </div>
            <article class="res"><h3>Prompt 1: The “Whole Person” Approach to Health and Wellness</h3><span class="badge">Reflection</span><p>Using the Rule of Eights as a guide, I do well on some parts and not others. My schedule gives me about nine hours of sleep, I swim, run, and walk regularly, and I aim for balanced meals with protein, carbs, and vegetables. I am less consistent with a daily mindfulness practice. Stress has hurt my studying mostly during busy work weeks, when I end up cramming. I will add two things to my Stress Toolkit: controlled breathing and a short daily gratitude check. I will also protect my music, reading, and exercise time as self-care so I avoid burnout.</p></article>
      <article class="res"><h3>Prompt 2: Cultivating Healthy Relationships and Personal Safety</h3><span class="badge">Reflection</span><p>My communities are my friends, my girlfriend, and my coworkers, and they mostly support me. I video call my girlfriend every day, and I start conversations in group chats and schedule meetups. For safety, I avoid drugs and alcohol, stay out of dangerous situations, and pay attention to my surroundings. Next semester I will keep my social time inside my schedule’s socialization blocks, so my social life supports my academic goals instead of distracting from them.</p></article>
      <article class="res"><h3>Prompt 3: Financial Literacy and Funding Your Future</h3><span class="badge">Reflection</span><p>I have not done a full budget review this semester, so my plan looks forward. I will separate needs, such as tuition, food, and transportation, from wants, and watch for emotional spending. To fund my degree, I will complete the FAFSA each year, apply for scholarships and grants first because they are free money, and use my job income. I would use loans only as a last resort and borrow as little as possible. Minimizing loans and credit card debt matters because interest compounds and takes away future income. I will also build a $1,000 emergency fund so a car repair or a broken laptop does not derail my education.</p></article>
      <a class="back" href="#contents">Back to contents</a>
    </div>
  </section>

  <section class="chapter" id="future-self" style="--c:#C6E65A;--i:7">
    <h2 class="tab">Letter to My Future Self</h2>
    <div class="sheet essay">
      <p class="byline">Noah Zielinski · CLC 120</p>
      <p>October 7, 2026</p>
      <p>Dear Noah,</p>
      <p>By the time you read this, the semester that began with a stack of syllabi and a color-coded weekly schedule will be a memory. I am writing from the middle of it so you remember who started this journey and why. Before you read anything else, open your portfolio. Every section is proof that you showed up and did the work.</p>
      <p>Start with your why. In the Five Whys exercise, we began with “Why am I in college?” and kept digging. The answers led from earning a degree, to cybersecurity usually requiring at least a bachelor’s degree, to enjoying problem-solving and building things with code, to wanting work that holds your interest and lets you lead projects. At the bottom was the core reason: you want a satisfying life built on setting goals and accomplishing them. That purpose matches your top values of problem-solving, creativity, and stability, and the traits your career assessment gave you: Investigative, Artistic, and Enterprising. Knowing your purpose is a booster to grit, so when a course gets hard, come back to this paragraph.</p>
      <p>Your North Star is a career in cybersecurity. The plan is to finish at CLC and transfer to a four-year university for a bachelor’s degree. This semester you set three SMART goals: pass all of your fall courses by December 2026, meet with your Academic Success Advisor, Emily Ciecil, before the semester ends to map your transfer requirements, and complete your first two semesters of major courses with at least a 3.5 GPA through spring 2027. If you missed one, adjust the date, not the dream. Remember that a career path is rarely a straight line. Your Career Coach worksheet matched you with Education Administrators at 91 percent, and you decided it was not for you. That was not wasted time. It was data. Stay open to unplanned opportunities, whether that is a club, an internship, or something at the startup where you already work.</p>
      <p>Now, a pep talk based on evidence. You are a critical and analytical thinker. When your work shifts collided with your classes, you found the root issue and generated three possible solutions instead of panicking. You are disciplined, and you fight like a demon to follow through on your goals. You try new tools, like Quizlet and shorthand, and you keep what works. Your blend of Romanian, American, and Japanese background reminds you that one perspective is never the whole picture, which makes you an open and empathetic collaborator. Keep a growth mindset instead of a fixed one. As Amy Baldwin’s College Success explains, abilities can be developed through effort, strategy, and feedback, so failure is just data that helps you learn. And have grit: the passion and perseverance to stick with your long-term goals when things get difficult.</p>
      <p>When motivation is not enough, use your academic toolkit. Do not read passively. You admitted that skimming is your main reading strategy, so pair it with SQ3R, surveying, questioning, reading, reciting, and reviewing, and use the Cornell Method so your notes come with built-in review questions. Keep your shorthand, and after class annotate your notes with associations to fight the Ebbinghaus Forgetting Curve. Do not cram. Use spacing, studying over several days, and interleaving, mixing up topics, and keep practicing with your Quizlet study guides. Manage your time with the Eisenhower Matrix: do the urgent and important tasks first, and schedule the important but not urgent ones into blocks. Use the Pomodoro Technique, eat the frog by doing the hardest task first, and write a Daily Top Three. Trust your weekly schedule, with its set blocks for work, study, and sleep. When the domino effect starts, take time from your socialization blocks before you take it from your sleep.</p>
      <p>Success is not a solitary activity. At CLC, you identified Counseling and Peer Support, the CLC Library, the Financial Aid Office, the Welcome and One Stop Center, the Technology Help Desk, and your Academic Success Advisor. When you ran into trouble with the student portal, a call to the One Stop Center was all it took. Use these resources early, before a small problem turns into a big one. Your Support Call List is short and strong: your girlfriend, whom you video call every day; your friends from the group chats; your coworkers at the startup; your instructors, Amanda Cash and Michelle Pas; and Emily Ciecil. They know your goals, so call them before you spiral, not after.</p>
      <p>Finally, be kind to yourself. Stress and setbacks are a normal part of the college experience, not a sign that you do not belong. Keep your engine running with the habits that carried you this semester: enough sleep, balanced meals, swimming, running, long walks, calming breaths, music, books, and your personal projects. Remember your favorite saying, “a book a day makes the happiness stay.” I believe in you. I believe you will finish your degree, build the career you want, and look back at this semester as the place where it started.</p>
      <p>Sincerely,<br><br><i style="font-size:1.5rem">Noah Zielinski</i></p>

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  document.getElementById('resources').innerHTML = resources.map((r, i) => `

  // Study Plan weekly schedule. Each entry is start-end|label|color, in 24-hour decimal time (0.5 = 12:30 AM).
  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const col = { g:'#D9EAD3', s:'#D9D2E9', y:'#FFF2CC', p:'#D0E0E3', o:'#FCE5CD', r:'#F4CCCC', b:'#CFE2F3' };
  const D='Decompress Time', SH='Study & Homework', EX='Extra School Time or Personal Projects', CS='College Success Seminar';
  const wk = (...b) => b;
  const sched = [

    [[.5,2,D,'g'],[2,11,'Sleep','s'],[11,12,'Brunch','g'],[12,13,'Transport','y'],[13,15,'Biology','r'],[15,16,'Transport','y'],[16,19,'Work','b'],[19,19.5,'Transport','y'],[19.5,20,'Dinner','g'],[20,21.5,SH,'o'],[21.5,22,'Calls w/ friends','g'],[22,23.5,SH,'o'],[23.5,24.5,D,'g']],

  sched[5] = sched[4]; // Saturday matches Friday
  const fmt = t => { const h = Math.floor(t) % 24, m = t % 1 ? ':30' : ':00'; return (h % 12 || 12) + m + (h < 12 ? ' AM' : ' PM'); };
  const grid = document.getElementById('grid');
  let g = '<div></div>' + days.map(d => `<div class="dh">${d}</div>`).join('');
  for (let i = 1; i < 48; i += 2) g += `<div class="tm" style="grid-row:${i + 2}">${fmt(.5 + i / 2)}</div>`;
  sched.forEach((day, d) => day.forEach(([s, e, label, c]) => {
    g += `<div class="blk" style="grid-column:${d + 2};grid-row:${(s - .5) * 2 + 2}/${(e - .5) * 2 + 2};--b:${col[c]}" title="${days[d]} ${fmt(s)}–${fmt(e)}">${esc(label)}</div>`;
  }));
  grid.innerHTML = g;
  }

  // ---- Sign-in: only Microsoft accounts ending in clcillinois.edu may see the portfolio ----
  // Setup (see the instructions I gave you): register a free app in Microsoft Entra, then paste its Application (client) ID here.
  const CLIENT_ID = '20b0e046-e70c-4622-a03e-8ad56cde4c5b';
  const REDIRECT = 'https://noahzielinski.github.io/portfolio/';
  const ALLOWED = /@([a-z0-9-]+\.)*clcillinois\.edu$/i;
  const $ = id => document.getElementById(id);
  const say = t => { $('msg').textContent = t; };

  function nuke() { // delete the content, not just hide it
    const v = $('vault'); if (v) v.remove();
    $('app').replaceChildren(); $('app').hidden = true; $('gate').hidden = false;
    sessionStorage.clear();
  }
  function unlock(m, acct) {
    $('gate').hidden = true; $('app').hidden = false;
    $('app').append($('vault').content.cloneNode(true)); $('vault').remove();
    build();
    $('who').innerHTML = '· ' + esc2(acct.username) + ' <button type="button" id="out">Sign out</button>';
    $('out').onclick = () => m.logoutRedirect({ account: acct, postLogoutRedirectUri: REDIRECT });
  }
  const esc2 = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function verify(m, acct) {
    if (ALLOWED.test(acct.username || '')) return unlock(m, acct);
    nuke(); $('signin').hidden = false;
    say('Access denied. This page is only for CLC accounts (ending in clcillinois.edu).');
  }
  (async () => {
    if (CLIENT_ID.startsWith('PASTE')) { $('signin').hidden = true; say('Setup needed: add your Microsoft app client ID to CLIENT_ID in this file.'); return; }
    const m = new msal.PublicClientApplication({
      auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/organizations', redirectUri: REDIRECT },
      cache: { cacheLocation: 'sessionStorage' }
    });
    await m.initialize();
    let res = null;
    try { res = await m.handleRedirectPromise(); }
    catch (e) { say('Sign-in error: ' + (e.errorCode || '') + ' ' + String(e.errorMessage || e.message || '').slice(0, 300)); }
    const acct = (res && res.account) || m.getAllAccounts()[0];
    if (acct) return verify(m, acct);
    $('signin').onclick = async () => {
      try { await m.loginRedirect({ scopes: ['openid', 'profile'] }); }
      catch (e) { say('Sign-in error: ' + (e.errorCode || '') + ' ' + String(e.errorMessage || e.message || '').slice(0, 300)); }
    };
  })();
